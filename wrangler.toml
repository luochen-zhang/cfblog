name = "cfblog"
main = "src/index.ts"
compatibility_date = "2024-01-01"

# Local development settings
# Note: AI binding will still connect to remote even in local mode
# This is expected behavior and will incur usage charges

# D1 Database binding
[[d1_databases]]
binding = "DB"
database_name = "cfblog-db"
database_id = "c691541b-3e28-42e5-ae62-7be5d5549c7b"

# R2 Storage binding
[[r2_buckets]]
binding = "MEDIA"
bucket_name = "pan"

# Workers AI binding
# Note: In local dev mode, AI still connects to remote Cloudflare AI
[ai]
binding = "AI"

[assets]
binding = "CACHE"
directory = "./public"
not_found_handling = "none"
# Static files under public/ are served directly without invoking the Worker,
# so they don't count against the Workers request quota. Everything else falls through to the Worker.
run_worker_first = false
